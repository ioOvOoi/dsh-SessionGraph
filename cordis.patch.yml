# SessionGraph bundle patch
# 本文件使 dsh-sessiongraph 声明为 bundle:执行
#   dsh plugin --profile <name> add github:ioOvOoi/dsh-SessionGraph#v0.1.3
# 后,reconcilePlugins 自动把本包加入 profile 的 dsh.profile.bundles,本补丁随之叠加,
# 无需手动编辑 cordis.patch.yml。
# 注意:注释必须用 #;行首 > 会被 YAML 解析为折叠标量(0.1.2 的教训)。
- insert:
    - id: sessiongraph
      name: 'dsh-sessiongraph'
